[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuskr-cli"
version = "0.1.1"
description = "CLI for the Tuskr test management API"
authors = [{ name = "Harish Gnanasekar", email = "harish.gnanasekar@talview.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["tuskr", "testing", "test-management", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.0",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/harish-talview/tuskr-cli"
Repository = "https://github.com/harish-talview/tuskr-cli"

[tool.setuptools.packages.find]
include = ["tuskr*"]

[project.scripts]
tuskr = "tuskr.cli:cli"
